<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width">
<title>緯度経度を指定してGoogle mapを開く</title>
<style>
input{font-size:1.4em;}
</style>
<script>
document.onkeydown =function(e){
	if(e.key == "Enter"){
		make_address();
	}
}

function make_address(){
	document.getElementById('lon').value = (Number(document.getElementById('inputFormLonDo').value) +Number(document.getElementById('inputFormLonHun').value / 60)+ Number(document.getElementById('inputFormLonByo').value/3600)).toFixed(7);
	document.getElementById('lat').value = (Number(document.getElementById('inputFormLatDo').value) +Number(document.getElementById('inputFormLatHun').value / 60)+ Number(document.getElementById('inputFormLatByo').value/3600)).toFixed(7);
	var lo = document.getElementById('lon').value;
	var la = document.getElementById('lat').value;
	output.href = "https://www.google.com/maps/place/" + la + "," + lo + "/@" + la + "," + lo + ","+ document.getElementById('zoom').value;
	output.innerText = "https://www.google.com/maps/place/" + la + "," + lo + "/@" + la + "," + lo + ","+ document.getElementById('zoom').value;
	if(soku.checked==true){output.click();}
};

</script>
</head>

<body>
<p>緯度経度を指定してGoogle mapを開く</p>
<p>
<table><tr><td>

緯度<input type="text" id="inputFormLatDo" name="inputFormLatDo" size=12>°<input type="text" id="inputFormLatHun" name="inputFormLatHun" size=2>′<input type="text" id="inputFormLatByo" name="inputFormLatByo" size=2>″<br>
経度<input type="text" id="inputFormLonDo" name="inputFormLonDo" size=12>°<input type="text" id="inputFormLonHun" name="inputFormLonHun" size=2>′<input type="text" id="inputFormLonByo" name="inputFormLonByo" size=2>″<button type="button" onclick="make_address();">度分秒の緯度経度で検索</button>

</td></tr></table><br><br>
	
<input type="checkbox" id="soku" checked="checked"><label for="soku">アドレス作ったら即開く</label>
<input type="hidden" id="lon"><input type="hidden" id="lat"><br>撮影高度（どれだけ広範囲か）
<select id="zoom" name="zoom">
<option value="100000m">100000m（東京近郊四県くらい）</option>
<option value="40000m">40000m（東京23区全域くらい）</option>
<option value="7500m" selected>7500m（上野と東京タワー）</option>
<option value="2600m">2600m（皇居と周辺）</option>
<option value="1000m">1000m（駅と周辺）</option>
</select>


<br><br>
<a href="#" id="output" target="_blank">adress</a>
</p>
	
<br>
<br>
<br>
・空欄は0として扱います。<br>
・小数点も可能です。<br>
・南緯/西経はマイナスで表現して下さい。<br>
</body>
</html>
